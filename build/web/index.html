<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hurghada Winners — نظام إدارة الأكاديميات الرياضية">
  <meta name="theme-color" content="#1CA9E8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hurghada Winners">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hurghada Winners</title>
  <link rel="manifest" href="manifest.json">

  <!-- شاشة تحميل تظهر فوراً بدل الشاشة البيضاء حتى يرسم Flutter أول إطار
       (تنزيل main.dart.js قد يستغرق ثوانٍ على اتصال بطيء). -->
  <style>
    html, body { margin: 0; height: 100%; background: #1CA9E8; }
    #app-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1CA9E8 0%, #0B7FB8 100%);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #fff;
      transition: opacity .35s ease;
    }
    #app-loader.hide { opacity: 0; pointer-events: none; }
    #app-loader .logo {
      width: 108px; height: 108px; border-radius: 26px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 14px 34px rgba(0,0,0,.22);
      animation: pulse 1.6s ease-in-out infinite;
    }
    #app-loader .logo img { width: 84px; height: 84px; object-fit: contain; }
    #app-loader .spinner {
      width: 34px; height: 34px; margin-top: 30px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: spin .9s linear infinite;
    }
    #app-loader .text { margin-top: 14px; font-size: 15px; font-weight: 600; opacity: .92; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="logo"><img src="icons/Icon-192.png" alt="Hurghada Winners"></div>
    <div class="spinner"></div>
    <div class="text">جاري التحميل...</div>
  </div>

  <script>
    // يُخفى اللودر عند أول إطار يرسمه Flutter، ثم يُزال من الصفحة.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loader');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
